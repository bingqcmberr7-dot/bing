<!DOCTYPE html>
   <html>
<head>


    <title> Contact </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
			font-size: auto;
        }

        body {
            background-image:url("(2).jpg");
            min-height: 100%;
            color: white;
			 background-position: center;
			background-size:cover;
			 width: 100%;
        }

        header {
            background: #DB7093;
            text-align: center;
            padding: 50px 30px;
        }

        header h1 {
            font-size: 38px;
        }

        nav {
            background: #1A1719;
            background: #1A1719;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 50px;
        }

        nav a {
            color: pink;
            text-decoration: none;
            padding: 25px 30px;
            border-radius: 10px;
            transition: 0.3s;
        }

        nav a:hover {
            background: #FFC0CB;
            transform: translateY(-3px);
        }

        .contact-container {
            width: 100%;
            max-width: 700px;
            margin:auto;
            background: rgba(255,255,255,0.1);
            padding: 50px;
            border-radius: 15px;
        }

        .contact-container h2 {
            text-align: center;
            color: #D9A7D0;
            margin-bottom: 80px;
            font-size: 50px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        textarea {
            height: 130px;
            resize: auto;
        }

        button {
            display: block;
            margin: auto;
            padding: 20px 35px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #DB97C2, #8A3E6E);
            color:pink;
            font-size: auto;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        footer {
            background: pink;
            text-align: center;
            padding: 30px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1> FOR MORE INFORMATION</h1>

    </header>

    <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
		<a href="product.html">PRODUCT</a>
    </nav>

    <div class="contact-container">

        <h2>Contact Us</h2>

        <form onsubmit="sendMessage(event)">

            <label>Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Message</label>
            <textarea id="message" placeholder="Write your message..." required></textarea>

            <button type="submit">Send Message</button>
			
<button type="submit"> <a href="login.html">LOG OUT</a></button>


        </form>

    </div>

    <footer>
        <p> Jinah | CHANEL COLLECTION</p>
   </footer>


    <script>
        function sendMessage(event) {
            event.preventDefault();

            alert("Thank you! Your message has been submitted.");

            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("message").value = "";
        }
    </script>

</body>
</html>
